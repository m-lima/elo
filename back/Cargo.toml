[package]
name = "elo"
version = "0.1.4"
edition = "2024"

[features]
default = []
log-spans = ["boile-rs/log-spans"]
local = ["dep:tower-http"]

[dependencies]
axum = { version = "0.8.1", features = ["ws"] }
boile-rs = { git = "https://github.com/m-lima/boile-rs", version = "0.1.2", features = [
  "log",
  "rt-shutdown",
] }
clap = { version = "4.5.30", features = ["derive"] }
hyper = { version = "1.6.0", default-features = false }
lettre = { version = "0.11.13", default-features = false, features = [
  "tracing",
  "smtp-transport",
  "pool",
  "hostname",
  "builder",
  "tokio1-rustls-tls",
] }
rand = "0.9.0"
rmp-serde = "1.3.0"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
skillratings = "0.27.1"
sqlx = { version = "0.8.3", features = ["sqlite", "runtime-tokio-rustls"] }
thiserror = "2.0.11"
tokio = "1.43.0"
tower-http = { version = "0.6.2", features = ["cors"], optional = true }
tower-layer = "0.3.3"
tower-service = "0.3.3"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true

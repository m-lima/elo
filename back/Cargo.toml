[package]
name = "elo"
version = "0.2.1"
edition = "2024"

[features]
default = []
log-spans = ["boile-rs/log-spans"]
local = ["dep:tower-http"]

[dependencies]
axum = { version = "0.8.8", features = ["ws"] }
boile-rs = { git = "https://github.com/m-lima/boile-rs", version = "0.1.2", features = [
  "log",
  "rt-shutdown",
] }
clap = { version = "4.5.54", features = ["derive"] }
hyper = { version = "1.8.1", default-features = false }
lettre = { version = "0.11.19", default-features = false, features = [
  "tracing",
  "smtp-transport",
  "pool",
  "hostname",
  "builder",
  "tokio1-rustls-tls",
] }
rand = "0.9.2"
rmp-serde = "1.3.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
skillratings = "0.28.2"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio-rustls"] }
thiserror = "2.0.18"
tokio = "1.49.0"
tower-http = { version = "0.6.8", features = ["cors"], optional = true }
tower-layer = "0.3.3"
tower-service = "0.3.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
